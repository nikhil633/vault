name: Terraform Deployment
on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - uses: actions/checkout@v4

      - name: Debug GitHub OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString()
            );
  
            console.log("issuer:", payload.iss);
            console.log("audience:", payload.aud);
            console.log("subject:", payload.sub);
            console.log("repository:", payload.repository);
            console.log("ref:", payload.ref);

      - name: Fetch Keys from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: http://34.72.57.226:8200
          role: gh-actions-role
          method: jwt
          secrets: |
            aws/creds/terraform-role access_key | AWS_ACCESS_KEY_ID ;
            aws/creds/terraform-role secret_key | AWS_SECRET_ACCESS_KEY

      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan
      - run: terraform apply -auto-approve
      - run: terraform destroy -auto-approve
